<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIS Media Board</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: production desk. Sticky masthead with one tab per unit; Planning works in a Sun–Sat month grid, each unit works a four-lane status board, every post opens in a side sheet. Mirrors fully for Arabic. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E7ECF0; --weekend:#E9EDF1; --line:#D3DAE1; --line-strong:#B5C0CA;
  --fg:#13202A; --muted:#55636F; --accent:#0E6B66; --accent-fg:#FFFFFF; --accent-soft:#D3EAE7;
  --u-planning:#0E6B66; --u-writing:#3B52C9; --u-design:#B3306B; --u-photo:#A86300; --on-unit:#FFFFFF;
  --danger:#B42F2A; --warn:#9A5B00; --ok:#1B7A44; --scrim:rgba(10,18,26,.42);
  --shadow:0 1px 2px rgba(19,32,42,.06),0 12px 32px rgba(19,32,42,.14);
  --viewer-bg:rgba(7,11,15,.94); --viewer-fg:#EEF2F5; --viewer-muted:#A9B5C0; --viewer-line:rgba(255,255,255,.28); --viewer-btn:rgba(255,255,255,.08);
  --f-display:"Schibsted Grotesk","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --track:.08em; --case:uppercase; --base:14px; --slide:24px;
  --r:8px; --gutter:clamp(16px,3vw,28px);
}
:root[lang="ar"]{
  --f-display:"IBM Plex Sans Arabic","Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Sans Arabic","IBM Plex Mono",system-ui,sans-serif;
  --track:0; --case:none; --base:15px; --slide:-24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141A; --surface:#141D25; --surface-2:#1B2630; --weekend:#111920; --line:#26333F; --line-strong:#3A4957;
    --fg:#E5EBF0; --muted:#94A2AF; --accent:#45B8AE; --accent-fg:#06211F; --accent-soft:#163633;
    --u-planning:#45B8AE; --u-writing:#8E9DFF; --u-design:#F07DB1; --u-photo:#EDA93F; --on-unit:#0D141A;
    --danger:#F0756D; --warn:#E9B65C; --ok:#55C487; --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#141D25; --surface-2:#1B2630; --weekend:#111920; --line:#26333F; --line-strong:#3A4957;
  --fg:#E5EBF0; --muted:#94A2AF; --accent:#45B8AE; --accent-fg:#06211F; --accent-soft:#163633;
  --u-planning:#45B8AE; --u-writing:#8E9DFF; --u-design:#F07DB1; --u-photo:#EDA93F; --on-unit:#0D141A;
  --danger:#F0756D; --warn:#E9B65C; --ok:#55C487; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--base);line-height:1.45}
body.locked{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1360px;margin:0 auto;padding-inline:var(--gutter);padding-block:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:end}
.eyebrow{font:500 11px/1.4 var(--f-mono);letter-spacing:var(--track);text-transform:var(--case);color:var(--muted)}
:root[lang="ar"] .eyebrow{font-size:12px}
.brand h1{font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin-top:3px}
:root[lang="ar"] .brand h1{letter-spacing:0}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tabs{grid-column:1/-1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 10px 11px;font:600 13.5px/1.1 var(--f-display);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
:root[lang="ar"] .tab{font-size:14.5px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--tab-c,var(--fg))}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--tab-c)}
.badge{font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.hot{background:var(--tab-c);color:var(--on-unit)}
.lang-btn{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}

/* Buttons and fields */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font:500 13px/1.15 var(--f-body);padding:8px 12px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
:root[lang="ar"] .btn{font-size:14px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:12.5px}
:root[lang="ar"] .btn.small{font-size:13.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.link-btn{appearance:none;border:0;background:none;padding:0;font:inherit;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;align-self:flex-start}
:root[lang="ar"] .link-btn{font-size:13.5px}
.link-btn:hover{color:var(--fg)}
.link-btn.danger{color:var(--danger)}
.who-btn .who-dot{width:9px;height:9px;border-radius:50%;background:var(--who-c,var(--muted))}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
select{cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:500;color:var(--muted)}
:root[lang="ar"] .field>span{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* Platform toggles */
.ptogs{display:flex;flex-wrap:wrap;gap:6px}
.ptog{appearance:none;position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:999px;padding-block:5px;padding-inline:6px 12px;font:500 13px/1.2 var(--f-body);cursor:pointer;user-select:none}
.ptog:hover{border-color:var(--fg);color:var(--fg)}
.ptog .ab{font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;padding:3px 4px;border-radius:3px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em}
.ptog input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ptog.on,.ptog[aria-pressed="true"],.ptog:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.ptog.on .ab,.ptog[aria-pressed="true"] .ab,.ptog:has(input:checked) .ab{background:var(--accent);color:var(--accent-fg)}
.ptog[aria-pressed="true"]::after,.ptog:has(input:checked)::after{content:"✓";font-size:12px;color:var(--accent)}
.ptog:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ptog[disabled]{cursor:default}

/* Page */
.wrap{max-width:1360px;margin:0 auto;padding-inline:var(--gutter);padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.toolbar .field{flex-direction:row;align-items:center;gap:8px}
.toolbar select{width:auto;padding:6px 8px;font-size:13px}
.banner{border:1px solid var(--line-strong);background:var(--surface);padding:10px 12px;border-radius:6px;font-size:13px}
.empty{padding:16px 18px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--muted);line-height:1.6;display:flex;flex-direction:column;gap:8px}
.empty strong{color:var(--fg);font-family:var(--f-display);font-size:15px}
.empty ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px;max-width:72ch}

/* Status markers: ring = unclaimed, pie fills as work moves */
.mk{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--u);background:conic-gradient(var(--u) 0 var(--p,0%),transparent 0);flex:none;display:inline-block}
.mk.off{border-style:dashed;border-color:var(--line-strong);background:none}

/* Calendar */
.cal-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.cal-title{display:flex;flex-direction:column;gap:2px}
.cal-title h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
:root[lang="ar"] .cal-title h2{letter-spacing:0}
.hijri{font:400 12px var(--f-mono);color:var(--muted)}
:root[lang="ar"] .hijri{font-size:13px}
.cal-nav{display:flex;gap:6px}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:13px;color:var(--muted)}
.strip b{font:600 13px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.strip .warn b{color:var(--warn)}
.strip .bad b{color:var(--danger)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.dow{font:500 11px var(--f-mono);text-transform:var(--case);letter-spacing:var(--track);color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
:root[lang="ar"] .dow{font-size:12.5px}
.dow:nth-child(7){border-inline-end:0}
.dow.we,.cell.we{background:var(--weekend)}
.cell{min-height:118px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.endcol{border-inline-end:0}
.cell.lastrow{border-bottom:0}
.cell.out .daynum{opacity:.45}
.cell.out .chip{opacity:.6}
.daynum{font:500 12px "IBM Plex Mono",ui-monospace,monospace;display:flex;justify-content:space-between;align-items:center;min-height:22px;font-variant-numeric:tabular-nums}
.daynum .n{padding:1px 5px;border-radius:4px}
.cell.today .daynum .n{background:var(--fg);color:var(--bg)}
.add-day{opacity:0;border:0;background:none;color:var(--muted);font:500 16px/1 "IBM Plex Mono",ui-monospace,monospace;padding:2px 6px;border-radius:4px;cursor:pointer}
.add-day:hover{background:var(--surface-2);color:var(--fg)}
.cell:hover .add-day,.add-day:focus-visible{opacity:1}
@media (hover:none){.add-day{opacity:.7}}
.chip{appearance:none;text-align:start;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.chip:hover{border-color:var(--line-strong)}
.chip-line{display:flex;gap:5px;min-width:0;align-items:baseline}
.chip-title{font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
:root[lang="ar"] .chip-title{font-size:13px}
.chip-time{font-size:11px;color:var(--muted);flex:none;font-family:"IBM Plex Mono",ui-monospace,monospace}
.chip-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.plat{font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;padding:2px 4px;border-radius:3px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em}
.plat.word{font-family:var(--f-body);letter-spacing:0;font-size:10.5px}
.chip.posted{opacity:.6}
.chip.posted .plat.done{background:var(--ok);color:var(--surface)}
.chip.late{border-color:var(--danger)}
.agenda{display:none;flex-direction:column;gap:14px}
.ag-day{display:flex;flex-direction:column;gap:6px}
.ag-day h3{font:500 12px var(--f-mono);color:var(--muted);text-transform:var(--case);letter-spacing:var(--track);display:flex;justify-content:space-between;align-items:center}
:root[lang="ar"] .ag-day h3{font-size:13px}
.ag-day.today h3{color:var(--fg)}
.ag-day .chip{padding:9px 10px}
.ag-day .chip-title{font-size:14px;white-space:normal}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
@media (max-width:760px){.cal{display:none}.agenda{display:flex}}

/* Unit boards */
.unit-head{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline}
.unit-head h2{font-size:24px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
:root[lang="ar"] .unit-head h2{letter-spacing:0}
.unit-head h2 .mk{width:14px;height:14px;border-width:2px}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane>h3{font:600 13px var(--f-display);display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px}
:root[lang="ar"] .lane>h3{font-size:14px}
.lane>h3 span{display:inline-flex;gap:7px;align-items:center}
.lane .none{font-size:12.5px;color:var(--muted);padding:6px 4px 8px}
.lane .more{font-size:12px;color:var(--muted);padding:2px 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;text-align:start}
.card:hover{border-color:var(--line-strong)}
.card.late{border-color:var(--danger)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;font:500 11.5px var(--f-mono);color:var(--muted);flex-wrap:wrap}
:root[lang="ar"] .card-top{font-size:12.5px}
.card h4{font-size:14.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.card .brief{color:var(--muted);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
:root[lang="ar"] .card-meta{font-size:12.5px}
.card-meta .late-tag{color:var(--danger);font-weight:500}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding-top:2px}
.card-foot select{width:auto;padding:5px 8px;font-size:12.5px;background:var(--surface)}
.unit-tag{display:inline-flex;gap:6px;align-items:center;font:600 12px var(--f-display);color:var(--fg)}
.people{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.person{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);display:inline-flex;gap:4px;align-items:center;max-width:100%}
.person.me{background:var(--accent-soft);font-weight:500}
.person button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;padding-inline-start:2px;font-size:14px;line-height:1}
.person button:hover{color:var(--danger)}
.section-h{font:600 15px var(--f-display);display:flex;gap:8px;align-items:baseline}
.section-h .muted{font:400 12px var(--f-mono)}

/* Side sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(580px,100%);background:var(--surface);z-index:41;overflow-y:auto;box-shadow:var(--shadow);padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;gap:18px}
@media (max-width:560px){.drawer{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:no-preference){.drawer:not([hidden]){animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(var(--slide));opacity:.6}to{transform:none;opacity:1}}}
.d-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-head{display:flex;flex-direction:column;gap:6px}
.d-head h2{font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
:root[lang="ar"] .d-head h2{letter-spacing:0}
.d-when{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.pill{font:500 11.5px/1.1 var(--f-mono);padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
:root[lang="ar"] .pill{font-size:12.5px}
.pill.ok{background:var(--ok);color:var(--surface)}
.pill.bad{background:var(--danger);color:var(--surface)}
.d-sec{display:flex;flex-direction:column;gap:6px}
.d-sec>h3{font:500 11px var(--f-mono);text-transform:var(--case);letter-spacing:var(--track);color:var(--muted)}
:root[lang="ar"] .d-sec>h3{font-size:13px;font-weight:600}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-width:70ch}
.prose a{color:var(--accent)}
.ublocks{display:flex;flex-direction:column;gap:12px}
.ublock{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ublock.off{border-style:dashed;padding-block:10px}
.ublock>header{display:flex;align-items:center;gap:8px}
.ublock>header h3{font-size:15px;font-weight:600;flex:1}
.u-state{font:500 12px var(--f-mono);color:var(--muted)}
.u-state.late{color:var(--danger)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;border-inline-end:1px solid var(--line);background:var(--surface);font:500 12px/1.2 var(--f-body);padding:7px 4px;color:var(--muted);cursor:pointer}
:root[lang="ar"] .seg button{font-size:13px}
.seg button:last-child{border-inline-end:0}
.seg button:hover{color:var(--fg);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--u);color:var(--on-unit)}
.people-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.people-row select{width:auto;max-width:100%;padding:6px 8px;font-size:12.5px}
.deliv{font-size:12.5px;color:var(--accent);overflow-wrap:anywhere}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--danger);border-radius:6px;font-size:13px}
.form{display:flex;flex-direction:column;gap:14px}
.form .actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}
.form .err{color:var(--danger);font-size:12.5px}
.needs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.person.open{background:transparent;border:1px dashed var(--line-strong);color:var(--muted)}

.need-row:last-child{border-bottom:0}
.need-due{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
:root[lang="ar"] .need-due{font-size:13px}
.need-due span{flex:none}
.need-due input{padding:6px 8px;font-size:13px}
.need-due input:disabled,.form input[type=date]:disabled,.form input[type=time]:disabled{opacity:.45}
@media (max-width:440px){.need-row{grid-template-columns:minmax(0,1fr)}}
.unsched{display:flex;flex-direction:column;gap:8px}
.unsched-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.plat.due{background:var(--accent-soft);color:var(--fg)}
.plat.due.late{background:var(--danger);color:var(--surface)}
.who-group{display:flex;flex-direction:column;gap:6px}
.who-find{display:flex;flex-direction:column;gap:8px}
.who-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--bg)}
.who-add select{width:auto}
.who-groups{display:flex;flex-direction:column;gap:14px}
.who-group h3{font:600 13px var(--f-display);display:flex;gap:8px;align-items:center}
.who-list{display:flex;flex-wrap:wrap;gap:6px}
.who-item{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.who-item button{appearance:none;border:0;background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:6px 12px;cursor:pointer}
.who-item button.x{padding-block:6px;padding-inline:4px 9px;color:var(--muted)}
.who-item button.x:hover{color:var(--danger)}
.who-item.sel{border-color:var(--accent)}
.who-item.sel button:first-child{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* Final post: uploaded visuals + caption */
.final{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile-btn{appearance:none;position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:0;overflow:hidden;cursor:zoom-in;aspect-ratio:4/5;width:100%;max-width:100%;display:grid;place-items:center}
.tile-btn:hover{border-color:var(--line-strong)}
.tile-btn img,.tile-btn video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile-num{position:absolute;top:5px;inset-inline-start:5px;font:500 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;background:var(--fg);color:var(--bg);padding:3px 5px;border-radius:3px}
.tile-play{position:absolute;bottom:6px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:9px}
.tile-doc{font:600 14px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.06em}
.tile-name{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-tools{display:flex;justify-content:space-between;align-items:center;gap:2px;min-height:24px}
.tile-tools .grp{display:flex;gap:2px}
.icon-btn{appearance:none;border:0;background:none;color:var(--muted);font:500 13px/1 var(--f-body);padding:5px 7px;border-radius:4px;cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.icon-btn.danger{color:var(--danger)}
.tile-confirm{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:12px}
.drop{position:relative;border:1.5px dashed var(--line-strong);border-radius:6px;padding:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--fg)}
.drop.over{background:var(--accent-soft)}
.drop:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.drop .hint{flex-basis:100%;font-size:12px}
.drop.busy{cursor:progress}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;width:min(220px,100%)}
.bar>i{display:block;height:100%;background:var(--accent);width:var(--w,0%);transition:width .2s}
.upl{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);font-size:13px;flex-basis:100%}
.errs{margin:0;padding-inline-start:18px;color:var(--danger);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.cap-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flabel{font-size:12px;font-weight:500;color:var(--muted)}

.viewer-info .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.viewer-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.viewer-actions{display:flex;gap:6px;flex-wrap:wrap}
.viewer .btn{background:var(--viewer-btn);color:var(--viewer-fg);border-color:var(--viewer-line);text-decoration:none}
.viewer .btn:hover{border-color:var(--viewer-fg)}
.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;gap:8px}
.viewer-media{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.viewer-media img,.viewer-media video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;display:block}
.viewer-doc{display:flex;flex-direction:column;gap:6px;align-items:center;padding:28px;border:1px solid var(--viewer-line);border-radius:8px;text-align:center}
.viewer-doc strong{font:600 22px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em}
.vnav{appearance:none;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--viewer-line);background:var(--viewer-btn);color:var(--viewer-fg);font-size:22px;line-height:1;cursor:pointer}

function h(tag,props,...kids){

  for(const k of kids.flat(Infinity)){ if(k==null||k===false||k==='') continue; el.append(k instanceof Node?k:String(k)); }
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(['value','checked','disabled','hidden','required','selected'].includes(k)) el[k]=v;
    else el.setAttribute(k,v===true?'':String(v));
  }
  return el;
}

function linkify(text){
  const out=[]; const re=/(https?:\/\/[^\s]+)/g; let last=0, m;
  while((m=re.exec(text))){
    if(m.index>last) out.push(text.slice(last,m.index));
    out.push(h('a',{href:m[1],target:'_blank',rel:'noopener noreferrer',dir:'ltr'},m[1]));
    last=m.index+m[1].length;
  }
  if(last<text.length) out.push(text.slice(last));
  return out;
}

const ACCEPT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',webm:'video/webm',pdf:'application/pdf'};
const EXT_OF={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/webm':'webm','application/pdf':'pdf'};
const ACCEPT_ATTR=Object.keys(EXT_OF).join(',')+',.png,.jpg,.jpeg,.webp,.gif,.mp4,.webm,.pdf';

}

async function uploadFiles(pid,list){

    try{
      const r=await S.assets.upload(f,{type});
      const data={postId:pid,name:String(f.name||'file').slice(0,180),type:r.contentType||type,size:r.sizeBytes||f.size,by:S.me||null,at:Date.now(),order:base+i};
      S.files.set(r.id,normFile(r.id,data)); reindex();
      if(canWrite()) await enqueue('files/'+r.id,()=>S.db.collection('files').doc(r.id).set(data));
      else await S.backend.fileAdd(S.me,pid,r.id,data);
      okN++;
    }catch(e){
      const c=e&&e.code;
      if(c==='quota_or_state'){ errs.push(t('errQuota')); break; }
      if(c==='rate_limited'){ errs.push(t('errRate')); break; }
      if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){ S.canUpload=false; errs.push(t('noUpload')); break; }
      errs.push(c==='too_large'?t('errSize',f.name):c==='unsupported_type'?t('errType',f.name):t('errUpload',f.name));
    }
  }
  S.uploading=null; S.uploadErrs=errs.length?{pid,list:errs}:null;
  renderAll(); renderDrawer();
  if(okN) toast(t('uploadedN',okN));
}
async function removeFile(fid){
  const f=S.files.get(fid); S.confirmFile=null;
  if(!f||!S.assets){ renderDrawer(); return; }
  S.files.delete(fid); tileCache.delete(fid); reindex(); renderAll(); renderDrawer();
  try{ await S.assets.delete(fid); }
  catch(e){ S.files.set(fid,f); reindex(); renderAll(); renderDrawer(); toast(t('errSave')); return; }
  if(canWrite()) enqueue('files/'+fid,()=>S.db.doc('files/'+fid).delete());
  else S.backend.fileRemove(S.me,fid).catch(e=>toast(e&&e.code==='not_assigned'?t('notAssigned'):t('errSave')));
}
function moveFile(pid,fid,dir){
  if(!canWrite()&&!onPost(S.posts.get(pid))) return;
  const list=filesFor(pid), i=list.findIndex(f=>f.id===fid), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=list[i], b=list[j];
  let oa=a.order, ob=b.order; if(oa===ob) ob=oa+dir;
  a.order=ob; b.order=oa; reindex(); renderAll(); renderDrawer();
  if(canWrite()){
    enqueue('files/'+a.id,()=>S.db.doc('files/'+a.id).update({order:ob}));
    enqueue('files/'+b.id,()=>S.db.doc('files/'+b.id).update({order:oa}));
  }else{
    const fail=e=>toast(e&&e.code==='not_assigned'?t('notAssigned'):t('errSave'));
    S.backend.fileReorder(S.me,a.id,ob).then(()=>S.backend.fileReorder(S.me,b.id,oa)).catch(fail);
  }
}
function downloadName(f){
  const ext=EXT_OF[f.type]||'png';
  const base=String(f.name||'file').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,120)||'file';
  return base+'.'+ext;
}
function downloadFile(f){

/* ---------- writes (one at a time per document) ---------- */
const queues=new Map();
function enqueue(path,task){
  const prev=queues.get(path)||Promise.resolve();
  const next=prev.catch(()=>{}).then(task);
  queues.set(path,next);
  return next.catch(handleWriteError);
}
function handleWriteError(e){
  const code=e&&e.code;
  if(code==='invalid_argument'&&S.canWrite!==false){ setUnlocked(false); renderAll(); toast(t('errViewOnly')); }
  else if(code==='quota_exceeded'){ toast(t('errFull')); }
  else if(code==='revoked'||code==='not_granted'){ S.canWrite=false; renderAll(); toast(t('errAccess')); }
  else{ toast(t('errSave')); }
}
function newId(col){ return S.db.collection(col).doc().id; }
function updatePost(id,patch){
  if(!canWrite()) return;
  return enqueue('posts/'+id,()=>S.db.doc('posts/'+id).update(Object.assign({},patch,{updatedAt:Date.now()})));
}
function updateUnit(id,k,patch){ return updatePost(id,{units:{[k]:patch}}); }
function take(id,k){
  const p=S.posts.get(id); if(!p||!S.backend) return;
  if(!S.me||!S.roster.get(S.me)){ S.after=()=>take(id,k); openWho(); return; }
  const u=p.units[k]; if(u.assignees.includes(S.me)) return;
  const legacy=()=>{ const patch={assignees:[...u.assignees,S.me]}; if(u.status==='open') patch.status='progress'; updateUnit(id,k,patch); };
  S.backend.takeUnit(id,k,S.me).then(()=>toast(t('toastTake',unitNoun(k),titleOf(p)))).catch(e=>{
    if(e&&e.code==='missing_fn'&&canWrite()){ legacy(); toast(t('toastTake',unitNoun(k),titleOf(p))); return; }
    toast(e&&e.code==='full'?t('spotTaken'):t('errSave'));
  });
}
function drop(id,k,rid){
  const p=S.posts.get(id); if(!p) return;
  const u=p.units[k];
  const legacy=()=>{ const assignees=u.assignees.filter(a=>a!==rid); const patch={assignees}; if(!assignees.length&&u.status==='progress') patch.status='open'; updateUnit(id,k,patch); };
  if(rid===S.me&&S.backend){
    S.backend.leaveUnit(id,k,rid).then(()=>toast(t('leftTask'))).catch(e=>{
      if(e&&e.code==='missing_fn'&&canWrite()){ legacy(); return; }
      toast(t('errSave'));
    });
    return;
  }
  legacy();
}
function assign(id,k,rid){
  const p=S.posts.get(id); if(!p||!rid) return;
  const u=p.units[k]; if(u.assignees.includes(rid)) return;
  const patch={assignees:[...u.assignees,rid]};
  if(u.status==='open') patch.status='progress';
  updateUnit(id,k,patch);
}
function setStatus(id,k,status){
  const p=S.posts.get(id); if(!p||p.units[k].status===status) return;
  if(canWrite()){ updateUnit(id,k,{status}); return; }
  if(onPost(p,k)&&S.backend) S.backend.unitStatus(S.me,id,k,status).catch(e=>toast(e&&e.code==='not_assigned'?t('notAssigned'):t('errSave')));
}
function setCaption(id,val){
  if(canWrite()){ updatePost(id,{caption:val}); return; }
  if(S.backend) S.backend.captionSet(S.me,id,val).catch(e=>toast(e&&e.code==='not_assigned'?t('notAssigned'):t('errSave')));
}
function togglePlatform(id,name){
  const p=S.posts.get(id); if(!p) return;
  const list=p.platforms.includes(name)?p.platforms.filter(x=>x!==name):[...p.platforms,name];
  updatePost(id,{platforms:sortPlatforms(list)});
}

function shiftMonth(n){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()+n,1); render(); }
function viewCalendar(){
  const y=S.month.getFullYear(), m=S.month.getMonth(), today=TODAY(), rtl=S.lang==='ar';
  const posts=filtered();
  const byDate=new Map();
  posts.slice().sort(byTime).forEach(p=>{ if(!byDate.has(p.date)) byDate.set(p.date,[]); byDate.get(p.date).push(p); });

  const head=h('div',{class:'cal-head'},
    h('div',{class:'cal-title'},h('h2',null,F.month.format(S.month)),h('span',{class:'hijri'},hijriRange(y,m))),

        h('button',{class:'btn small',type:'button',onclick:()=>{ S.month=firstOfMonth(new Date()); render(); }},t('today')),
        h('button',{class:'btn small',type:'button','aria-label':t('nextMonth'),onclick:()=>shiftMonth(1)},rtl?'‹':'›'))));

  const end=ymd(addDays(new Date(),13));
  const up=posts.filter(p=>p.date>=today&&p.date<=end&&!p.posted);
  const unclaimed=up.reduce((n,p)=>n+UNIT_KEYS.filter(k=>spotsLeft(p,k)>0).length,0);
  const behind=posts.filter(isPostLate).length;
  const unsched=posts.filter(p=>!p.date).sort((a,b)=>(nextDue(a)||'9999').localeCompare(nextDue(b)||'9999')||a.title.localeCompare(b.title));
  const strip=h('div',{class:'strip'},h('span',null,t('next14')),
    stat('sPosts',up.length), stat('sUnclaimedTasks',unclaimed,unclaimed?'warn':''), stat('sBehind',behind,behind?'bad':''),
    unsched.length?stat('sUnscheduled',unsched.length):null);

  const parts=[head,strip];
  if(S.loaded.posts&&S.posts.size===0){
    parts.push(h('div',{class:'empty'},h('strong',null,t('emptyTitle')),h('ol',null,t('emptySteps').map(s=>h('li',null,s)))));
  }
  if(unsched.length){
    parts.push(h('section',{class:'unsched','aria-label':t('unscheduled')},
      h('h3',{class:'section-h'},t('unscheduled'),h('span',{class:'muted'},unsched.length)),
      h('div',{class:'unsched-list'},unsched.map(p=>chip(p,{long:true,due:true})))));
  }

  const first=new Date(y,m,1), offset=first.getDay(), days=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((offset+days)/7), start=addDays(first,-offset);
  const grid=h('div',{class:'cal','aria-label':F.month.format(S.month)});
  const sunday=addDays(start,0);
  for(let i=0;i<7;i++) grid.append(h('div',{class:'dow'+(i>=5?' we':'')},F.wd.format(addDays(sunday,i))));
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), key=ymd(d), dow=d.getDay();
    const items=byDate.get(key)||[];
    const cls=['cell'];
    if(dow===5||dow===6) cls.push('we');
    if(d.getMonth()!==m) cls.push('out');
    if(key===today) cls.push('today');
    if(i%7===6) cls.push('endcol');
    if(i>=(weeks-1)*7) cls.push('lastrow');
    grid.append(h('div',{class:cls.join(' ')},
      h('div',{class:'daynum'},h('span',{class:'n'},d.getDate()),
        canWrite()?h('button',{class:'add-day',type:'button','aria-label':t('addOn',fmtDay(key)),onclick:()=>openForm(null,key)},'+'):null),
      items.map(p=>chip(p))));
  }

  const ag=h('div',{class:'agenda'});
  const monthKeys=[...byDate.keys()].filter(k=>{ const d=parseYmd(k); return d&&d.getFullYear()===y&&d.getMonth()===m; }).sort();
  if(!monthKeys.length){
    ag.append(h('div',{class:'empty'},h('strong',null,t('nothingIn',F.month.format(S.month))),
      canWrite()?h('div',null,h('button',{class:'btn small',type:'button',onclick:()=>openForm(null,null)},t('newPost'))):null));
  }
  monthKeys.forEach(k=>ag.append(h('section',{class:'ag-day'+(k===today?' today':'')},
    h('h3',null,h('span',null,fmtDay(k)+(k===today?t('todaySuffix'):'')),
      canWrite()?h('button',{class:'add-day',type:'button','aria-label':t('addOn',fmtDay(k)),onclick:()=>openForm(null,k)},'+'):null),
    byDate.get(k).map(p=>chip(p,{long:true})))));

  const legend=h('div',{class:'legend'},
    UNIT_KEYS.map(k=>h('span',null,mk(k,'done'),unitShort(k))),
    h('span',null,'·'),
    STATUS_KEYS.map(s=>{ const e=mk('writing',s); e.style.setProperty('--u','var(--muted)'); return h('span',null,e,statusLabel(s)); }),
    h('span',null,t('weekendNote')));

  parts.push(grid,ag,legend);
  return parts;
}

      }))),
    h('fieldset',fs,h('span',null,t('publishing')),
      h('div',{class:'grid2'},
        h('label',{class:'field'},h('span',null,t('pubDate')),dateIn),
        h('label',{class:'field'},h('span',null,t('timeOpt')),timeIn)),
      h('label',{class:'check'},h('input',{type:'checkbox',id:'pf-nodate',checked:noDate,onchange:e=>{ dateIn.disabled=timeIn.disabled=e.target.checked; }}),t('noPubDate'))),
    err,
    h('div',{class:'actions'},
      h('button',{class:'btn',type:'button',onclick:()=>{ if(id){ S.drawer={mode:'view',id}; renderDrawer(true); } else closeDrawer(); }},t('cancel')),
      h('button',{class:'btn primary',type:'submit'},id?t('saveChanges'):t('addToCal'))));
  return [closeBar(),h('h2',{id:'d-title',tabindex:'-1'},id?t('editPost'):t('newPost')),form];
}
function submitForm(id,form,err){
  const f=readForm(form);
  const title=f.title.trim();
  const date=f.noDate?'':f.date, time=f.noDate?'':f.time;
  const fail=m=>{ err.textContent=m; err.hidden=false; };
  if(!title) return fail(t('errTitle'));
  if(!f.noDate&&!isYmd(date)) return fail(t('errDate'));
  const late=UNIT_KEYS.find(k=>f.units[k].needed&&isYmd(f.units[k].due)&&date&&f.units[k].due>date);
  if(late) return fail(t('errDueAfter',unitLabel(late)));
  const core={title,date,time,platforms:sortPlatforms(f.platforms),format:f.format,project:f.project,brief:f.brief,refs:f.refs};
  const dueOfForm=k=>isYmd(f.units[k].due)?f.units[k].due:'';
  if(id){
    updatePost(id,Object.assign({},core,{units:Object.fromEntries(UNIT_KEYS.map(k=>[k,f.units[k].needed?{needed:true,due:dueOfForm(k),slots:f.units[k].slots}:{needed:false}]))}));
    toast(t('saved'));
  }else{
    id=newId('posts');
    const now=Date.now();
    const data=Object.assign({},core,{caption:'',posted:false,createdBy:S.me||null,createdAt:now,updatedAt:now,
      units:Object.fromEntries(UNIT_KEYS.map(k=>[k,{needed:f.units[k].needed,assignees:[],status:'open',due:f.units[k].needed?dueOfForm(k):'',slots:f.units[k].needed?f.units[k].slots:1,link:'',note:''}]))});
    S.posts.set(id,norm(id,data));
    enqueue('posts/'+id,()=>S.db.collection('posts').doc(id).set(data));
    const dd=parseYmd(date); if(dd) S.month=firstOfMonth(dd);
    toast(dd?t('added'):t('addedUnsched'));
  }
  S.drawer={mode:'view',id}; renderDrawer(true); render();
}
function openCode(){ S.lastFocus=document.activeElement; S.drawer={mode:'code'}; renderDrawer(true); }
function setUnlocked(on){ S.canWrite=!!on; S.canUpload=!!on&&!!S.assets; }
function drawerCode(){
  const err=h('p',{class:'err',hidden:true,role:'alert'});
  const input=h('input',{id:'team-code',type:'text',autocomplete:'off',autocapitalize:'characters',spellcheck:'false',dir:'ltr','data-autofocus':'',value:S.teamCode||''});
  const btn=h('button',{class:'btn primary',type:'submit'},t('unlock'));
  const form=h('form',{class:'form',onsubmit:async e=>{
      e.preventDefault();
      const v=input.value.trim(); if(!v||!S.backend) return;
      btn.disabled=true; btn.textContent=t('codeChecking');
      let ok=false, failed=false;
      try{ ok=!!(await S.backend.checkCode(v)); }catch(x){ failed=true; }
      btn.disabled=false; btn.textContent=t('unlock');
      if(failed){ err.textContent=t('errSave'); err.hidden=false; return; }
      if(!ok){ err.textContent=t('codeWrong'); err.hidden=false; return; }
      S.teamCode=v; LS.set('code',v); setUnlocked(true);
      S.drawer=null; renderDrawer(); render(); toast(t('codeOk'));
    }},
    h('label',{class:'field'},h('span',null,t('codeLabel')),input), err, h('div',{class:'actions'},btn));
  return [closeBar(),h('div',{class:'d-head'},h('h2',{id:'d-title',tabindex:'-1'},t('codeTitle')),h('p',{class:'muted'},t('codeBody'))),form];
}
const normName=v=>String(v||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
function chooseMe(id){ S.me=id; LS.set('me',id); const after=S.after; S.after=null; S.drawer=null; renderDrawer(); render(); if(after) after(); else toast(t('hi',personName(id))); }
function drawerWho(){
  const cw=canWrite();
  const out=[closeBar(),h('div',{class:'d-head'},h('h2',{id:'d-title',tabindex:'-1'},t('whoTitle')),h('p',{class:'muted'},t('whoBody')))];
  if(!S.loaded.roster){ out.push(h('p',{class:'muted'},t('loadingMembers'))); return out; }
  const q0=(S.drawer&&S.drawer.q)||'';
  const input=h('input',{id:'who-search',type:'text',dir:'auto',autocomplete:'off',placeholder:t('searchPh'),value:q0,'data-autofocus':''});
  const listBox=h('div',{class:'who-groups'}), addBox=h('div');
  const teamSel=h('select',{id:'who-team','aria-label':t('addUnit')},TEAM_KEYS.map(k=>h('option',{value:k},teamLabel(k))));
  if(S.drawer&&S.drawer.team) teamSel.value=S.drawer.team;
  teamSel.addEventListener('change',()=>{ if(S.drawer) S.drawer.team=teamSel.value; });
  const err=h('p',{class:'err',hidden:true,role:'alert'});
  let busy=false;
  const add=async()=>{
    const name=input.value.trim().replace(/\s+/g,' ').slice(0,60);
    if(name.length<2){ err.textContent=t('nameShort'); err.hidden=false; return; }
    if(!S.backend||busy) return;
    busy=true;
    try{ const id=await S.backend.rosterAdd(name,teamSel.value); if(id) chooseMe(id); }
    catch(e){ err.textContent=t('errSave'); err.hidden=false; }
    busy=false;
  };
  const fill=()=>{
    const q=normName(input.value);
    listBox.replaceChildren(); addBox.replaceChildren();
    let shown=0, exact=false;
    TEAM_KEYS.forEach(team=>{
      const members=[...S.roster.entries()].filter(([,r])=>r.team===team&&(!q||normName(r.name).includes(q))).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
      if(!members.length) return;
      shown+=members.length;
      if(q&&members.some(([,r])=>normName(r.name)===q)) exact=true;
      const dot=h('span',{class:'mk'}); dot.style.setProperty('--u',`var(--u-${team})`); dot.style.setProperty('--p','100%');
      listBox.append(h('section',{class:'who-group'},h('h3',null,dot,teamLabel(team)),
        h('div',{class:'who-list'},members.map(([id,r])=>{
          const nm=r.name||t('thisMember');
          if(S.confirmRemove===id){
            return h('span',{class:'confirm'},t('removeQ',nm),
              h('button',{class:'btn danger small',type:'button',onclick:()=>{ S.confirmRemove=null; if(S.me===id){ S.me=null; LS.set('me',null); } enqueue('roster/'+id,()=>S.db.doc('roster/'+id).delete()); S.roster.delete(id); renderAll(); renderDrawer(); }},t('removeBtn')),
              h('button',{class:'btn small',type:'button',onclick:()=>{ S.confirmRemove=null; renderDrawer(); }},t('cancel')));
          }
          return h('span',{class:'who-item'+(S.me===id?' sel':'')},
            h('button',{type:'button',dir:'auto','aria-pressed':String(S.me===id),onclick:()=>chooseMe(id)},r.name||t('unnamed')),
            cw?h('button',{class:'x',type:'button','aria-label':t('removeFromBoard',nm),onclick:()=>{ S.confirmRemove=id; renderDrawer(); }},'×'):null);
        }))));
    });
    if(q&&!shown) listBox.append(h('p',{class:'muted small'},t('noMatch')));
    if(!q&&!S.roster.size) listBox.append(h('div',{class:'empty'},h('strong',null,t('noneJoined')),t('noneJoinedBody')));
    if(q&&!exact&&S.backend){
      addBox.append(h('div',{class:'who-add'},
        h('button',{class:'btn primary small',type:'button',onclick:add},t('addAs',input.value.trim())),
        h('label',{class:'field',style:'flex-direction:row;align-items:center;gap:6px'},h('span',null,t('addUnit')),teamSel)));
    }
  };
  input.addEventListener('input',()=>{ if(S.drawer) S.drawer.q=input.value; err.hidden=true; fill(); });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const q=normName(input.value); const hit=q&&[...S.roster.entries()].find(([,r])=>normName(r.name)===q); if(hit) chooseMe(hit[0]); else add(); } });
  fill();
  out.push(h('div',{class:'who-find'},h('label',{class:'field'},h('span',null,t('searchName')),input),addBox,err),listBox);
  if(S.me&&S.roster.get(S.me)) out.push(h('button',{class:'link-btn',type:'button',onclick:()=>{ S.me=null; LS.set('me',null); renderAll(); renderDrawer(); }},t('clearName')));
  if(S.teamCode) out.push(h('button',{class:'link-btn',type:'button',onclick:()=>{ S.teamCode=''; LS.set('code',''); setUnlocked(false); S.drawer=null; renderDrawer(); renderAll(); }},t('forgetCode')));
  return out;
}

/* ---------- events ---------- */
$('#who-btn').addEventListener('click',openWho);
$('#new-btn').addEventListener('click',()=>openForm(null,null));
$('#scrim').addEventListener('click',closeDrawer);

document.addEventListener('keydown',e=>{
  if(S.viewer){

    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){

      const fwd=(e.key==='ArrowRight')!==(S.lang==='ar');

applyLang();
render();
/* ---------- Supabase backend (same shape the board used inside Claude) ---------- */
function deepMerge(a,b){
  if(!a||typeof a!=='object'||Array.isArray(a)||!b||typeof b!=='object'||Array.isArray(b)) return b;
  const out=Object.assign({},a);
  for(const k of Object.keys(b)) out[k]=(k in out)?deepMerge(out[k],b[k]):b[k];
  return out;
}
function makeBackend(){
  const key=String(CFG.supabaseAnonKey||'');
  if(!window.supabase||!CFG.supabaseUrl||!key||/PASTE/i.test(key)) return null;
  const sb=window.supabase.createClient(CFG.supabaseUrl,key,{auth:{persistSession:false,autoRefreshToken:false}});
  const mapErr=e=>{
    const c=e&&e.code, m=(e&&e.message)||'';
    if(/not_assigned/.test(m)) return {code:'not_assigned',message:m};
    if(/\bfull\b/.test(m)) return {code:'full',message:m};
    if(c==='PGRST202'||/could not find the function/i.test(m)) return {code:'missing_fn',message:m};
    if(c==='42501'||/bad_code/.test(m)) return {code:'invalid_argument',message:m};
    if(c==='P0002'||c==='22023') return {code:'invalid_argument',message:m};
    return {code:'unavailable',message:m};
  };
  const rpc=async(fn,args)=>{ const r=await sb.rpc(fn,args); if(r.error) throw mapErr(r.error); return r.data; };
  const cache=new Map(), listeners=new Map(), pending=new Set(); let timer=null;
  const emit=c=>{
    const rows=cache.get(c)||[];
    const snap={docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data})),size:rows.length,empty:!rows.length,
      metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};
    (listeners.get(c)||new Set()).forEach(fn=>{ try{ fn(snap); }catch(e){ console.error(e); } });
  };
  const fetchCol=async c=>{
    const r=await sb.from('board_docs').select('id,data').eq('collection',c).limit(5000);
    if(r.error) throw mapErr(r.error);
    cache.set(c,(r.data||[]).map(x=>({id:x.id,data:x.data||{}}))); emit(c);
  };
  const schedule=c=>{ pending.add(c); clearTimeout(timer); timer=setTimeout(()=>{ const cs=[...pending]; pending.clear(); cs.forEach(x=>fetchCol(x).catch(()=>{})); },250); };
  const refreshAll=()=>listeners.forEach((_,c)=>schedule(c));
  try{
    sb.channel('board-docs').on('postgres_changes',{event:'*',schema:'public',table:'board_docs'},p=>{
      const c=(p.new&&p.new.collection)||(p.old&&p.old.collection); if(c) schedule(c); else refreshAll();
    }).subscribe();
  }catch(e){}
  setInterval(refreshAll,45000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll(); });
  const localPut=(c,id,data)=>{ const rows=(cache.get(c)||[]).filter(r=>r.id!==id); if(data) rows.push({id,data}); cache.set(c,rows); emit(c); };
  const newId=()=>{ const a=new Uint8Array(15); crypto.getRandomValues(a); return Array.from(a,x=>(x%36).toString(36)).join(''); };
  const code=()=>S.teamCode||'';
  const ref=(c,id)=>({
    id,
    set:async d=>{ localPut(c,id,d); try{ await rpc('doc_set',{p_code:code(),p_collection:c,p_id:id,p_data:d}); }catch(e){ schedule(c); throw e; } schedule(c); },
    update:async d=>{ const cur=(cache.get(c)||[]).find(r=>r.id===id); if(cur) localPut(c,id,deepMerge(cur.data,d));
      try{ await rpc('doc_update',{p_code:code(),p_collection:c,p_id:id,p_patch:d}); }catch(e){ schedule(c); throw e; } schedule(c); },
    delete:async()=>{ localPut(c,id,null); try{ await rpc('doc_delete',{p_code:code(),p_collection:c,p_id:id}); }catch(e){ schedule(c); throw e; } schedule(c); }
  });
  const db={
    collection:c=>({
      doc:id=>ref(c,id||newId()),
      onSnapshot:(next,onErr)=>{
        if(!listeners.has(c)) listeners.set(c,new Set());
        listeners.get(c).add(next);
        fetchCol(c).catch(e=>{ if(onErr) onErr(e); });
        return ()=>listeners.get(c).delete(next);
      }
    }),
    doc:path=>{ const i=path.indexOf('/'); return ref(path.slice(0,i),path.slice(i+1)); }
  };
  const assets={
    upload:async(file,o)=>{
      const type=(o&&o.type)||file.type, id=newId()+'.'+(EXT_OF[type]||'bin');
      const r=await sb.storage.from(BUCKET).upload(id,file,{contentType:type,upsert:false,cacheControl:'31536000'});
      if(r.error){ const m=r.error.message||'';
        throw {code:/size|large|exceed/i.test(m)?'too_large':/mime|type/i.test(m)?'unsupported_type':/quota/i.test(m)?'quota_or_state':'upstream_error',message:m}; }
      return {id,url:blobUrl(id),sizeBytes:file.size,contentType:type};
    },
    delete:async()=>({deleted:false})
  };
  const rosterAdd=async(name,team)=>{ const id=await rpc('roster_add',{p_name:name,p_team:team}); if(id){ localPut('roster',id,{name,team,uid:null,createdAt:Date.now()}); schedule('roster'); } return id; };
  const unitPatch=(postId,k,fn)=>{
    const cur=(cache.get('posts')||[]).find(r=>r.id===postId); if(!cur) return;
    const u=(cur.data.units||{})[k]||{}, as=Array.isArray(u.assignees)?u.assignees:[];
    const nu=fn(u,as); if(nu) localPut('posts',postId,deepMerge(cur.data,{units:{[k]:nu}}));
  };
  const takeUnit=async(postId,k,member)=>{
    unitPatch(postId,k,(u,as)=>as.includes(member)?null:Object.assign({assignees:[...as,member]},(u.status||'open')==='open'?{status:'progress'}:{}));
    try{ await rpc('unit_take',{p_post:postId,p_unit:k,p_member:member}); }catch(e){ schedule('posts'); throw e; }
    schedule('posts');
  };
  const leaveUnit=async(postId,k,member)=>{
    unitPatch(postId,k,(u,as)=>{ const left=as.filter(a=>a!==member); return Object.assign({assignees:left},(!left.length&&u.status==='progress')?{status:'open'}:{}); });
    try{ await rpc('unit_leave',{p_post:postId,p_unit:k,p_member:member}); }catch(e){ schedule('posts'); throw e; }
    schedule('posts');
  };
  const call=async(fn,args,col)=>{ try{ await rpc(fn,args); }catch(e){ schedule(col); throw e; } schedule(col); };
  const postPatch=(postId,patch)=>{ const cur=(cache.get('posts')||[]).find(r=>r.id===postId); if(cur) localPut('posts',postId,deepMerge(cur.data,patch)); };
  const fileAdd=async(member,post,id,d)=>{ localPut('files',id,d);
    await call('file_add',{p_member:member,p_post:post,p_file:id,p_name:d.name,p_type:d.type,p_size:d.size,p_order:d.order},'files'); };
  const fileRemove=async(member,id)=>{ localPut('files',id,null); await call('file_remove',{p_member:member,p_file:id},'files'); };
  const fileReorder=async(member,id,order)=>{ const cur=(cache.get('files')||[]).find(r=>r.id===id);
    if(cur) localPut('files',id,Object.assign({},cur.data,{order})); await call('file_reorder',{p_member:member,p_file:id,p_order:order},'files'); };
  const captionSet=async(member,post,caption)=>{ postPatch(post,{caption}); await call('caption_set',{p_member:member,p_post:post,p_caption:caption},'posts'); };
  const unitStatus=async(member,post,unit,status)=>{ postPatch(post,{units:{[unit]:{status}}});
    await call('unit_status',{p_member:member,p_post:post,p_unit:unit,p_status:status},'posts'); };
  return {db,assets,checkCode:c=>rpc('check_board_code',{p_code:c}),rosterAdd,takeUnit,leaveUnit,fileAdd,fileRemove,fileReorder,captionSet,unitStatus};
}
async function boot(){
  const be=makeBackend();
  if(!be){ S.configMissing=true; S.status='offline'; S.loaded.posts=true; S.loaded.roster=true; render(); return; }
  S.backend=be; S.db=be.db; S.assets=be.assets; S.downloads=true; setUnlocked(false);
  S.status='ready';
  if(S.teamCode){
    try{ const ok=await be.checkCode(S.teamCode); if(ok) setUnlocked(true); else { S.teamCode=''; LS.set('code',''); } }catch(e){}
  }
  const db=S.db;
  db.collection('files').onSnapshot(snap=>{
    S.files=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,normFile(d.id,d.data())]));
    reindex(); renderAll();
  },()=>{});
  db.collection('posts').onSnapshot(snap=>{
    S.posts=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,norm(d.id,d.data())]));
    S.loaded.posts=true; renderAll();
  },()=>{ S.status='offline'; S.loaded.posts=true; renderAll(); });
  db.collection('roster').onSnapshot(snap=>{
    S.roster=new Map(snap.docs.filter(d=>d.exists).map(d=>{ const x=d.data()||{}; return [d.id,{name:typeof x.name==='string'?x.name:'',team:TEAM_KEYS.includes(x.team)?x.team:'planning',uid:x.uid||null}]; }));
    S.loaded.roster=true;
    if(S.me&&!S.roster.has(S.me)){ S.me=null; LS.set('me',null); }
    renderAll();
  },()=>{ S.loaded.roster=true; renderAll(); });
  render();
}
boot();
})();
